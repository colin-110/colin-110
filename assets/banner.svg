<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Colin K Thomas. I build backends that survive kill -9, Linux tools that make 60 Hz screens run at 96, and a boat that clears water hyacinth from ponds.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f9e">
        <animate attributeName="stop-color" values="#ff5f9e;#a855f7;#3b82f6;#ff5f9e" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#06b6d4;#a855f7" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#f97316;#3b82f6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="860" height="250" rx="20"/></clipPath>
    <linearGradient id="fadeL" x1="580" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="waterFade"><rect x="560" y="200" width="300" height="60" fill="url(#fadeL)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.35"/></filter>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .rise { animation: rise 0.8s ease-out both; }
    .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#round)">
    <rect width="860" height="250" fill="url(#bg)"/>
    <circle cx="120" cy="40" r="90" fill="#fde68a" opacity="0.35" filter="url(#soft)">
      <animate attributeName="cx" values="120;220;120" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="220" r="110" fill="#22d3ee" opacity="0.4" filter="url(#soft)">
      <animate attributeName="cy" values="220;170;220" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="260" r="80" fill="#f472b6" opacity="0.35" filter="url(#soft)">
      <animate attributeName="cx" values="460;380;460" dur="16s" repeatCount="indefinite"/>
    </circle>
    <!-- sparkles -->
    <g fill="#ffffff">
      <circle cx="600" cy="34" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="80" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="200" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="225" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="26" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g class="sans" fill="#ffffff">
    <text x="48" y="84" font-size="48" font-weight="800" filter="url(#shadow)" class="rise">Colin K Thomas</text>
    <text x="48" y="122" font-size="18" font-weight="500" class="rise d1">I build backends that survive <tspan class="mono" font-weight="700" fill="#fef08a">kill -9</tspan>, Linux tools</text>
    <text x="48" y="146" font-size="18" font-weight="500" class="rise d1">that make 60 Hz screens run at 96, and a boat that</text>
    <text x="48" y="170" font-size="18" font-weight="500" class="rise d1">clears <tspan font-weight="700" fill="#bbf7d0">water hyacinth</tspan> from ponds.</text>
  </g>

  <g class="sans rise d2" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="48" y="190" width="124" height="30" rx="15" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="110" y="210">backend systems</text>
    <rect x="180" y="190" width="108" height="30" rx="15" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="234" y="210">linux tooling</text>
    <rect x="296" y="190" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="338" y="210">robotics</text>
    <rect x="388" y="190" width="136" height="30" rx="15" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.45"/>
    <text x="456" y="210">CS @ VIT Chennai</text>
  </g>

  <!-- monitor that "overclocks" from 60 Hz to 96 Hz -->
  <g class="rise d3">
    <rect x="630" y="44" width="184" height="124" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <rect x="712" y="168" width="20" height="22" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="684" y="188" width="76" height="8" rx="4" fill="#ffffff" fill-opacity="0.85"/>
    <clipPath id="screen"><rect x="636" y="50" width="172" height="112" rx="8"/></clipPath>
    <g clip-path="url(#screen)">
      <rect x="636" y="50" width="172" height="112" fill="#0f172a"/>
      <rect x="636" y="50" width="172" height="3" fill="#38bdf8" opacity="0.6">
        <animate attributeName="y" values="50;160" dur="1s" repeatCount="indefinite"/>
      </rect>
      <text x="722" y="80" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">refresh rate</text>
      <text x="722" y="122" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#94a3b8">60 Hz
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="722" y="122" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#4ade80" opacity="0">96 Hz
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.95;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="722" y="146" text-anchor="middle" class="mono" font-size="11" fill="#4ade80" opacity="0">✓ linuxcru
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.95;1" dur="5s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- a small boat collecting water hyacinth -->
  <g clip-path="url(#round)" class="rise d3">
    <g mask="url(#waterFade)">
    <rect x="580" y="238" width="280" height="14" fill="#ffffff" fill-opacity="0.14"/>
    <path d="M580 238 q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
      <g opacity="1">
        <circle cx="700" cy="236" r="5" fill="#22c55e"/><circle cx="707" cy="234" r="4.5" fill="#4ade80"/><circle cx="703" cy="231" r="2" fill="#d8b4fe"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.27;0.30;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="1">
        <circle cx="760" cy="236" r="5" fill="#22c55e"/><circle cx="767" cy="234" r="4.5" fill="#4ade80"/><circle cx="763" cy="231" r="2" fill="#d8b4fe"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.57;0.60;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="1">
        <circle cx="818" cy="236" r="5" fill="#22c55e"/><circle cx="825" cy="234" r="4.5" fill="#4ade80"/><circle cx="821" cy="231" r="2" fill="#d8b4fe"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.86;0.89;1" dur="9s" repeatCount="indefinite"/>
      </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;200 0" dur="9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="1.6s" repeatCount="indefinite"/>
        <path d="M596 229 h48 l-7 9 h-34 z" fill="#ffffff"/>
        <rect x="608" y="220" width="18" height="9" rx="2" fill="#ffffff" fill-opacity="0.9"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.93;1" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
