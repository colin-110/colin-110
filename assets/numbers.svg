<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-label="By the numbers: linuxcru took my laptop panel from 60 to 96 Hz. My college funded an autonomous water hyacinth boat I designed and built with 30,000 rupees. Lumen reaches 98% Recall@5 with 25 ms reranking. Meeting Summarizer has notes ready 14.8 s after stopping. FleetOps lost 0 readings in kill -9 chaos tests. Fact Knowledge Layer read 17 of 20 chart pages without paid vision calls.">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", Ubuntu, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .lab { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; opacity: 0.85; }
    .big { font-size: 40px; font-weight: 800; }
    .cap { font-size: 13.5px; font-weight: 500; opacity: 0.95; }
    .tile { animation: pop 0.6s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: center; }
    .t1 { animation-delay: 0.05s; } .t2 { animation-delay: 0.15s; } .t3 { animation-delay: 0.25s; }
    .t4 { animation-delay: 0.35s; } .t5 { animation-delay: 0.45s; } .t6 { animation-delay: 0.55s; }
    @keyframes pop { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  </style>

  <g class="tile t1">
    <rect x="0" y="0" width="272" height="135" rx="16" fill="url(#g1)"/>
    <text x="22" y="30" class="lab">LINUXCRU</text>
    <text x="22" y="78" class="big">60 → 96 Hz</text>
    <text x="22" y="108" class="cap">my own laptop panel, overclocked</text>
  </g>
  <g class="tile t2">
    <rect x="294" y="0" width="272" height="135" rx="16" fill="url(#g2)"/>
    <text x="316" y="30" class="lab">HYACINTH BOAT</text>
    <text x="316" y="78" class="big">₹30,000</text>
    <text x="316" y="102" class="cap">college funding for an autonomous</text>
    <text x="316" y="120" class="cap">boat I designed and built</text>
  </g>
  <g class="tile t3">
    <rect x="588" y="0" width="272" height="135" rx="16" fill="url(#g3)"/>
    <text x="610" y="30" class="lab">LUMEN</text>
    <text x="610" y="78" class="big">98%</text>
    <text x="610" y="102" class="cap">Recall@5 on the evaluation set,</text>
    <text x="610" y="120" class="cap">reranked in 25 ms</text>
  </g>
  <g class="tile t4">
    <rect x="0" y="155" width="272" height="135" rx="16" fill="url(#g4)"/>
    <text x="22" y="185" class="lab">MEETING SUMMARIZER</text>
    <text x="22" y="233" class="big">14.8 s</text>
    <text x="22" y="257" class="cap">from pressing stop to meeting notes</text>
    <text x="22" y="275" class="cap">(it used to be 65.7 s)</text>
  </g>
  <g class="tile t5">
    <rect x="294" y="155" width="272" height="135" rx="16" fill="url(#g5)"/>
    <text x="316" y="185" class="lab">FLEETOPS</text>
    <text x="316" y="233" class="big">0 lost</text>
    <text x="316" y="257" class="cap">readings, after kill -9 on the robots,</text>
    <text x="316" y="275" class="cap">the API and the broker</text>
  </g>
  <g class="tile t6">
    <rect x="588" y="155" width="272" height="135" rx="16" fill="url(#g6)"/>
    <text x="610" y="185" class="lab">FACT KNOWLEDGE LAYER</text>
    <text x="610" y="233" class="big">17 / 20</text>
    <text x="610" y="257" class="cap">chart pages read without a single</text>
    <text x="610" y="275" class="cap">paid vision call</text>
  </g>
</svg>
